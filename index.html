<title>יפנית לדרך</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column. Sticky header holds a boarding-pass strip and the tab bar; each tab is a stack of panels. */
:root {
  --paper: #F2F4F7; --surface: #FFFFFF; --ink: #17213A; --muted: #5A6377; --line: #D9DEE7;
  --ai: #2B4A8A; --ai-soft: #E2E8F4; --on-ai: #FFFFFF;
  --hl: #FFE27A; --hl-ink: #17213A;
  --ok: #2E7A4E; --ok-soft: #E1F1E7; --bad: #B23E2C; --bad-soft: #F8E4E0; --shu: #C4473A;
  --display: "Rubik", "Assistant", system-ui, sans-serif;
  --body: "Assistant", system-ui, sans-serif;
  --ja: "Zen Maru Gothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1320; --surface: #172034; --ink: #E7EBF3; --muted: #9AA3B6; --line: #29334A;
    --ai: #8EADF0; --ai-soft: #22314F; --on-ai: #0E1320;
    --hl: #E8C653; --hl-ink: #14192A;
    --ok: #6CC892; --ok-soft: #1B3428; --bad: #F08A78; --bad-soft: #3A2220; --shu: #F07A6A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1320; --surface: #172034; --ink: #E7EBF3; --muted: #9AA3B6; --line: #29334A;
  --ai: #8EADF0; --ai-soft: #22314F; --on-ai: #0E1320;
  --hl: #E8C653; --hl-ink: #14192A;
  --ok: #6CC892; --ok-soft: #1B3428; --bad: #F08A78; --bad-soft: #3A2220; --shu: #F07A6A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 400 1rem/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
.app { max-width: 500px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; display: flex; flex-direction: column; gap: 14px; }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 12px 8px; display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
h1 { font: 700 1.45rem/1.1 var(--display); margin: 0; letter-spacing: -.01em; }
h1 .ja { font-family: var(--ja); color: var(--ai); font-size: .8em; margin-inline-start: 6px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; font-weight: 600; }
nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
nav button { border: 0; background: none; border-radius: 9px; padding: 8px 4px; font-weight: 600; color: var(--muted); }
nav button[aria-selected="true"] { background: var(--ai); color: var(--on-ai); }

h2 { font: 700 1.1rem/1.3 var(--display); margin: 0; text-wrap: balance; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 600; }
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--on-ai); }
.btn.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.btn.soft { background: var(--ai-soft); border-color: transparent; color: var(--ai); }
.btn:disabled { opacity: .5; cursor: default; }
.tag { display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-radius: 99px; background: var(--ai-soft); color: var(--ai); }
.tag.warn { background: var(--bad-soft); color: var(--bad); }
.tag.good { background: var(--ok-soft); color: var(--ok); }

/* boarding pass strip */
.pass { display: grid; grid-template-columns: 1fr auto; gap: 0; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.pass .main { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pass .route { font: 700 1.5rem/1 var(--display); letter-spacing: .04em; direction: ltr; text-align: right; }
.pass .route span { color: var(--muted); font-weight: 500; margin: 0 6px; }
.pass .stub { border-inline-start: 2px dashed var(--line); padding: 14px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 96px; background: var(--ai-soft); }
.pass .stub b { font: 700 1.9rem/1 var(--display); color: var(--ai); font-variant-numeric: tabular-nums; }
.pass input { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 2px 6px; font-size: .88rem; }
.goal { display: flex; flex-direction: column; gap: 6px; }
.bar { height: 8px; border-radius: 99px; background: var(--ai-soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ai); border-radius: 99px; transition: width .3s; }
.ready { display: grid; gap: 10px; }
.ready button { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; text-align: start; border: 0; background: none; padding: 0; }
.ready button .bar { grid-column: 1 / -1; }
.ready b { font-variant-numeric: tabular-nums; }

/* scenario chips */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip.add { border-style: dashed; color: var(--ai); }

/* captions */
.cap { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cap .ja { font: 500 1.45rem/1.9 var(--ja); direction: ltr; text-align: left; }
.cap .ro { direction: ltr; text-align: left; color: var(--muted); font-size: 1rem; }
.cap .hetr { color: var(--muted); font-size: 1rem; }
.cap .tr { font-weight: 600; border-top: 1px solid var(--line); padding-top: 6px; }
.cap .off { color: var(--muted); font-style: italic; }
.tk { border-radius: 6px; padding: 0 2px; transition: background .12s; }
button.tk { border: 0; background: none; font: inherit; color: inherit; padding: 0 2px; }
button.tk:hover { background: var(--ai-soft); }
.tk.on { background: var(--hl); color: var(--hl-ink); }
.ro .tk, .hetr .tk { margin-inline-end: .35em; }
rt { font-size: .45em; color: var(--muted); }
.tk.on rt { color: var(--hl-ink); }

/* conversation */
.stage { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: start; }
.stage.noav { grid-template-columns: 1fr; }
.av { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.av svg { width: 112px; height: auto; max-width: 100%; }
.av .who { font-weight: 700; font-size: .9rem; }
.av .role { font-size: .78rem; color: var(--muted); line-height: 1.3; }
.mouth { transform-box: fill-box; transform-origin: center; }
.speaking .mouth { animation: talk .18s ease-in-out infinite alternate; }
@keyframes talk { from { transform: scaleY(.35); } to { transform: scaleY(1.7); } }
.eyes { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
@keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
.bubble { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; border-start-start-radius: 4px; padding: 12px 14px; min-width: 0; }
.he-bubble { background: var(--ai-soft); color: var(--ink); border-radius: 14px; padding: 10px 14px; font-weight: 600; }
.he-bubble.bad { background: var(--bad-soft); }
.he-bubble.good { background: var(--ok-soft); }
.seg { display: inline-grid; grid-template-columns: repeat(3, auto); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-weight: 600; font-size: .88rem; }
.seg button + button { border-inline-start: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.helps { display: flex; gap: 6px; flex-wrap: wrap; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: start; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; display: block; width: 100%; }
.opt:hover { border-color: var(--ai); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt .cap .ja { font-size: 1.15rem; line-height: 1.8; }
.ask { display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px 12px; }
.log { display: flex; flex-direction: column; gap: 6px; }
.log .l { font-size: .92rem; padding: 6px 10px; border-radius: 10px; background: var(--paper); }
.log .l.me { background: var(--ai-soft); margin-inline-start: 24px; }
.log .l .j { font-family: var(--ja); direction: ltr; text-align: left; }
.done { display: flex; gap: 14px; align-items: center; }
.stamp { flex: none; width: 64px; height: 64px; border: 3px solid var(--shu); color: var(--shu); border-radius: 50%; display: grid; place-items: center; font: 700 1.6rem/1 var(--ja); transform: rotate(-12deg); }
.tip { border-inline-start: 3px solid var(--shu); padding-inline-start: 10px; }

/* flashcards */
.card { border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); padding: 22px 16px; min-height: 210px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; width: 100%; }
.card .big { font: 700 2.4rem/1.6 var(--ja); }
.card .big rt { font-size: .38em; }
.card .meaning { font: 700 1.3rem/1.3 var(--display); color: var(--ai); }
.counter { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.twin { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.twin .btn { padding: 12px; }
.btn.no { background: var(--bad-soft); border-color: transparent; color: var(--bad); }

/* quiz + lists */
.q4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.q4 button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px; font-weight: 600; }
.q4 button.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.q4 button.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.filters input, .filters select { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px 10px; min-width: 0; width: 100%; }
.filters input { grid-column: 1 / -1; }
.wl { display: flex; flex-direction: column; }
.wl .w { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.wl .w:last-child { border-bottom: 0; }
.wl .w .j { font: 500 1.25rem/1.5 var(--ja); grid-row: span 2; min-width: 3.5em; direction: ltr; }
.wl .w .m { font-weight: 700; }
.wl .w .r { color: var(--muted); font-size: .85rem; grid-column: 2; }
.wl .w .act { grid-row: 1 / span 2; grid-column: 3; display: flex; gap: 6px; align-items: center; }
.play { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; width: 34px; height: 34px; display: grid; place-items: center; padding: 0; }
.play svg { width: 14px; height: 14px; fill: currentColor; }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgb(10 14 25 / .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 500px; border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: 88vh; overflow-y: auto; }
.sheet .head { display: flex; justify-content: space-between; align-items: center; }
.sw { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; }
.sw input { width: 20px; height: 20px; accent-color: var(--ai); }
.chars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chars button { border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .85rem; font-weight: 600; }
.chars button[aria-pressed="true"] { border-color: var(--ai); background: var(--ai-soft); }
.chars svg { width: 64px; height: auto; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 12px; }
.note { font-size: .85rem; color: var(--muted); }
.wordsheet .big { font: 700 2.2rem/1.6 var(--ja); direction: ltr; text-align: center; }
.wordsheet dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
.wordsheet dt { color: var(--muted); }
.wordsheet dd { margin: 0; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .speaking .mouth, .eyes { animation: none; } .bar i { transition: none; } }
/* conversation picker, word chips */
.nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.nums button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 0; font-weight: 700; font-variant-numeric: tabular-nums; position: relative; }
.nums button[aria-pressed="true"] { background: var(--ai); border-color: var(--ai); color: var(--on-ai); }
.nums button.done::after { content: "✓"; position: absolute; top: 0; inset-inline-end: 5px; font-size: .72rem; color: var(--ok); }
.nums button.done[aria-pressed="true"]::after { color: var(--on-ai); }
.wchips { display: flex; flex-wrap: wrap; gap: 6px; }
.wchip { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 4px 12px; display: inline-flex; gap: 6px; align-items: baseline; }
.wchip .j { font: 700 1rem var(--ja); }
.wchip .m { color: var(--muted); font-size: .85rem; }
.chip.free { border-color: var(--ai); color: var(--ai); }
.chip.free[aria-pressed="true"] { background: var(--ai); color: var(--on-ai); }
.tipcard { background: var(--paper); border: 1px solid var(--line); border-inline-start: 4px solid var(--shu); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
.tipcard b { color: var(--shu); font-size: .9rem; }
.seg.two { grid-template-columns: repeat(2, auto); align-self: flex-start; }
/* free chat */
.chat { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.msg { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.msg.me { align-self: flex-start; max-width: 92%; background: var(--ai-soft); border-radius: 14px; border-start-start-radius: 4px; padding: 10px 14px; }
.msg.me .learn { border-top: 1px solid var(--line); padding-top: 6px; display: flex; flex-direction: column; gap: 4px; }
.msg .cap .ja { font-size: 1.2rem; line-height: 1.8; }
.mini { display: flex; gap: 6px; flex-wrap: wrap; }
.mini .btn, .mini-btn { padding: 4px 10px; font-size: .85rem; }
/* trip mode */
.alg { display: flex; flex-wrap: wrap; gap: 6px; }
.alg label { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 4px 12px; display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }
.alg input { accent-color: var(--ai); width: 16px; height: 16px; }
.showgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.showgrid button { text-align: start; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 10px 12px; font-weight: 600; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.showgrid button .j { font: 500 .9rem/1.5 var(--ja); color: var(--muted); direction: ltr; text-align: left; overflow-wrap: anywhere; }
.showov { position: fixed; inset: 0; z-index: 30; background: var(--surface); display: flex; flex-direction: column; gap: 18px; overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.showov .bigja { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: .3em; font: 700 clamp(1.9rem, 8.5vw, 3.4rem)/1.45 var(--ja); direction: ltr; text-align: left; overflow-wrap: anywhere; }
.showov .bigja.sm { font-size: clamp(1.6rem, 7vw, 2.8rem); }
.showov .he { font-size: 1.1rem; color: var(--muted); }
.pb { display: flex; flex-direction: column; }
.pb .p { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.pb .p[hidden] { display: none; }
.pb .p .j { font: 500 1.15rem/1.6 var(--ja); direction: ltr; text-align: left; overflow-wrap: anywhere; }
.pb .p .r { color: var(--muted); font-size: .85rem; direction: ltr; text-align: left; }
.pb .p .m { font-weight: 700; }
.pb .p .h { color: var(--muted); font-size: .85rem; }
.pb .p .act { grid-column: 2; grid-row: 1 / span 4; display: flex; flex-direction: column; gap: 6px; align-items: center; }
nav button { font-size: .9rem; padding: 8px 2px; line-height: 1.2; }
.convtitle { margin: 2px 0 -4px; font-size: 1.15rem; }
.log .l { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.log .l .lt { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.log .l .j { font-size: 1.05rem; }
.log .l .ht { color: var(--muted); font-size: .88rem; }
.log .l .j .tk { padding: 0; }
</style>

<div class="app" dir="rtl">
  <header>
    <div class="top">
      <h1>יפנית לדרך<span class="ja" lang="ja">日本語</span></h1>
      <button class="icon-btn" id="openSettings" aria-label="הגדרות לימוד">הגדרות</button>
    </div>
    <nav role="tablist">
      <button role="tab" data-tab="today" aria-selected="true">היום</button>
      <button role="tab" data-tab="talk" aria-selected="false">שיחה</button>
      <button role="tab" data-tab="cards" aria-selected="false">מילים</button>
      <button role="tab" data-tab="mine" aria-selected="false">המילים שלי</button>
      <button role="tab" data-tab="trip" aria-selected="false">בטיול</button>
    </nav>
  </header>
  <main id="view" style="display:flex;flex-direction:column;gap:14px"></main>
  <p class="note">גרסת הדגמה ללא התחברות: משתמש דובר עברית שלומד יפנית. ההתקדמות נשמרת בדפדפן הזה בלבד.</p>

<script type="text/plain" id="dsl">
@airport|שדה תעופה|ביקורת הגבולות

# המזוודה שלא הגיעה
r דלפק המטען האבוד
w スーツケース|sūtsukēsu|מזוודה ; 見つかりません|mitsukarimasen|לא נמצא|みつかりません ; 黒|kuro|שחור|くろ ; 連絡|renraku|הודעה, יצירת קשר|れんらく
n どう|dō|מה, איך / されましたか。|saremashita ka?|קרה (בנימוס)? = מה קרה?
u ~sumimasen / スーツケース|sūtsukēsu|מזוודה / ~ga / 見つかりません。|mitsukarimasen.|לא נמצא|みつかりません = סליחה, המזוודה שלי לא נמצאת.
x スーツケース|sūtsukēsu|מזוודה / ~o / ~kudasai = תן לי מזוודה, בבקשה. = ביקשת לקבל מזוודה. כדי לומר שהמזוודה לא נמצאה אומרים スーツケースが見つかりません (סוצקאס גה מיצוקארימאסן).
n 何色|naniiro|איזה צבע|なにいろ / ~desuka = באיזה צבע היא?
u 黒|kuro|שחור|くろ / ~desu = שחורה.

  "בבית, בריוקאן ובחלק מהמסעדות חולצים נעליים. מדרגה בכניסה וארון נעליים הם הסימן.",
  "מדברים בשקט במקומות ציבוריים, במיוחד ברכבת, באוטובוס ובמקדשים.",

  "כרטיס ביקור מקבלים בשתי ידיים, מסתכלים עליו רגע ולא מכניסים אותו מיד לכיס.",
  "מעשנים רק באזורים מסומנים. בהרבה ערים ביפן אסור לעשן ברחוב.",
  "את האשפה לוקחים איתכם, כי כמעט אין פחים ברחוב.",
  "ביפן לא משאירים טיפ, לא במסעדה, לא במונית ולא במלון.",
  "באונסן מתרחצים היטב בישיבה לפני שנכנסים למים."
];
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- state ---------- */
let S = store.get("state", null);
if (!S) {
  // first visit: an example of yesterday's lesson so the daily review has something to show
  S = {
    settings: { ja: true, furi: true, ro: true, hetr: true, tr: false, speed: 1, avatar: true, ch: "haruka" },
    words: {}, days: [YESTERDAY], lessons: [{ date: YESTERDAY, scn: "airport", items: ["空港", "パスポート", "出口", "トイレ"], example: true }],
    done: {}, custom: [], flight: addDays(TODAY, 24), goal: { date: TODAY, n: 0 }
  };
  for (const k of S.lessons[0].items) {
    const w = RAW.airport.words.map(tok).find(x => x.ja === k);
    S.words[k] = { ...w, scn: "airport", box: 1, due: TODAY, wrong: 0, rated: true, added: YESTERDAY, example: true };
  }
}
// migrations from the one-conversation version
for (const k of Object.keys(S.done || {})) if (!Array.isArray(S.done[k])) S.done[k] = S.done[k] ? [0] : [];
S.done ||= {}; S.pos ||= {}; S.free ||= [];
S.trip ||= { hotel: "", addr: "", alg: [], pork: false, veg: false };
S.custom = (S.custom || []).map(c => c.convs ? c : { id: c.id, custom: true, title: c.title, role: c.role, convs: [{ title: c.title, role: c.role, tip: c.tip, words: c.words, dialog: c.dialog }] });
if (S.goal.date !== TODAY) S.goal = { date: TODAY, n: 0 };
const save = () => store.set("state", S);

let SCN = {};
function topicOf(t) {
  const seen = new Set(), words = [];
  for (const c of t.convs) for (const w of c.words) if (!seen.has(w.ja)) { seen.add(w.ja); words.push(w); }
  return { ...t, words, tips: t.convs.map(c => c.tip).filter(Boolean) };
}
function loadScenarios() {
  SCN = {};
  for (const id of ORDER) SCN[id] = topicOf(BUILT[id]);
  for (const c of S.custom) SCN[c.id] = topicOf(c);
  SCN[FREE] = { id: FREE, free: true, title: "שיחה חופשית", role: "שיחה חופשית", convs: [], words: [], tips: ETIQ };
}
loadScenarios();
const learnIds = () => [...ORDER, ...S.custom.map(c => c.id)];
const scnIds = () => [...learnIds(), FREE];
const convIdx = id => Math.min(S.pos[id] || 0, Math.max(SCN[id].convs.length - 1, 0));
const curConv = () => SCN[cur].convs[convIdx(cur)];
const doneList = id => S.done[id] || [];

/* ---------- progress ---------- */
function touch(scnId, w) {
  if (!S.days.includes(TODAY)) S.days.push(TODAY);
  let L = S.lessons[S.lessons.length - 1];
  if (!L || L.date !== TODAY || L.scn !== scnId) { L = { date: TODAY, scn: scnId, items: [] }; S.lessons.push(L); if (S.lessons.length > 30) S.lessons.shift(); }
  if (w && !L.items.includes(w.ja) && L.items.length < 8) L.items.push(w.ja);
  S.goal.n++; save();
}
function addWord(w, scnId) {
  if (!S.words[w.ja]) S.words[w.ja] = { ja: w.ja, kana: w.kana, ro: w.ro, he: w.he, scn: scnId, box: 0, due: TODAY, wrong: 0, rated: false, added: TODAY };
  save();
}
const INTERVAL = [0, 1, 2, 4, 7, 14];
function rate(w, scnId, know) {
  addWord(w, scnId); const e = S.words[w.ja];
  e.rated = true; e.example = false;
  if (know) e.box = Math.min(e.box + 1, 5); else { e.box = 0; e.wrong++; }
  e.due = addDays(TODAY, INTERVAL[e.box]);
  touch(scnId, w);
}
function status(e) {
  if (!e.rated) return "חדשה";
  if (e.box >= 3) return "שולט";
  if (e.wrong >= 2) return "קשה";
  return "בתרגול";
}
function streak() {
  const set = new Set(S.days); let d = set.has(TODAY) ? TODAY : YESTERDAY, n = 0;
  while (set.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
function readiness(id) {
  const sc = SCN[id]; if (!sc.words.length) return 0;
  const known = sc.words.filter(w => (S.words[w.ja]?.box || 0) >= 2).length;
  return Math.round((known / sc.words.length) * 60 + (doneList(id).length / sc.convs.length) * 40);
}
const due = () => Object.values(S.words).filter(e => e.due <= TODAY);

/* ---------- app state ---------- */

let conv = null, cardsState = null, cardScope = "conv", review = null, filt = { q: "", scn: "", st: "", sort: "new" };
let pb = { q: "", scn: "" }, freeCur = null, fz = { pending: false, err: "", draft: "", tr: {}, ctl: null };
function resetConv() { conv = { i: 0, log: [], wrong: -1, help: null, showTr: false, hint: false, started: false, finished: false }; }
resetConv();

document.querySelector("nav").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  stopSpeech(); tab = b.dataset.tab;
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  render(); window.scrollTo(0, 0);
});
function go(t) { document.querySelector(`nav button[data-tab="${t}"]`).click(); }
addEventListener("online", () => { if (tab === "trip" || (tab === "talk" && cur === FREE)) render(); });
addEventListener("offline", () => { if (tab === "trip" || (tab === "talk" && cur === FREE)) render(); });
const online = () => navigator.onLine !== false;

function chipsHTML() {
  return `<div class="chips" role="group" aria-label="נושא">${scnIds().map(id => `<button class="chip${id === FREE ? " free" : ""}" data-scn="${id}" aria-pressed="${id === cur}">${esc(SCN[id].title)}</button>`).join("")}

}
function bindChips(root) {

}

function render() {
  const v = $("#view");
  const views = { today: [todayHTML, bindToday], talk: cur === FREE ? [freeHTML, bindFree] : [talkHTML, bindTalk], cards: [cardsHTML, bindCards], mine: [mineHTML, bindMine], trip: [tripHTML, bindTrip] }[tab];
  v.innerHTML = views[0]();
  bindChips(v);
  views[1](v);
}

/* ---------- TODAY ---------- */
function prevLesson() { for (let i = S.lessons.length - 1; i >= 0; i--) if (S.lessons[i].date < TODAY && S.lessons[i].items.length) return S.lessons[i]; return null; }

  const goalN = Math.min(S.goal.n, 15);
  const L = prevLesson(); const d = due();
  let rev = "";

    const when = L.date === YESTERDAY ? "אתמול" : L.date.split("-").reverse().join(".");
    if (review && review.done) {
      rev = `<div class="he-bubble good">חזרה הושלמה: ${review.score} מתוך ${review.qs.length} נכונות. אפשר להמשיך לשיעור חדש.</div>${review.tip ? `<p class="tip" style="margin:0"><b>טיפ תרבותי:</b> ${esc(review.tip)}</p>` : ""}`;
    } else if (review) {

        <div class="q4">${q.choices.map((c, i) => `<button data-a="${i}" class="${review.picked == null ? "" : (c === q.w.he ? "right" : (i === review.picked ? "wrong" : ""))}" ${review.picked != null ? "disabled" : ""}>${esc(c)}</button>`).join("")}</div>
        ${review.picked != null ? `<button class="btn primary" id="rvNext">${review.k + 1 < review.qs.length ? "הבא" : "סיום"}</button>` : ""}`;
    } else {
      rev = `<div class="wl">${items.map(e => `<div class="w"><div class="j">${jaHTML(e, S.settings.furi)}</div><div class="m">${esc(e.he)}</div><div class="r">${esc(e.ro)} · ${esc(heTr(e.ro))}</div><div class="act"><button class="play" data-say='${esc(JSON.stringify(e))}' aria-label="השמעה">${PLAY_ICON}</button></div></div>`).join("")}</div>
        <div class="row"><button class="btn primary" id="rvStart">תרגול חוזר קצר</button><button class="btn" id="rvSkip">דלג לשיעור חדש</button></div>`;
    }
    rev = `<section class="panel"><div class="row" style="justify-content:space-between"><h2>חזרה על השיעור הקודם</h2>${L.example ? '<span class="tag">דוגמה</span>' : ""}</div>
      <p class="muted small" style="margin:0">${when}: ${esc(SCN[L.scn]?.title || "")}${L.example ? ". כך תיראה החזרה בכל יום חדש." : ""}</p>${rev}</section>`;
  }
  return `
  <section class="pass" aria-label="כרטיס הטיסה שלך">
    <div class="main">
      <span class="muted small">טיסה ליפן</span>
      <div class="route">TLV<span>→</span>NRT</div>
      <label class="small muted">תאריך טיסה <input type="date" id="flight" value="${esc(S.flight || "")}"></label>
    </div>
    <div class="stub"><b>${days == null ? "?" : Math.max(days, 0)}</b><span class="small">ימים לטיסה</span></div>
  </section>
  <section class="panel">
    <div class="row" style="justify-content:space-between"><h2>היעד היומי</h2><span class="tag ${streak() ? "good" : ""}">רצף: ${streak()} ימים</span></div>
    <div class="goal"><div class="bar"><i style="width:${goalN / 15 * 100}%"></i></div><span class="small muted">${goalN} מתוך 15 תרגולים היום</span></div>
    ${d.length ? `<div class="row" style="justify-content:space-between"><span>${d.length} מילים מחכות לחזרה היום</span><button class="btn soft" id="dueGo">לחזרה</button></div>` : `<span class="small muted">אין מילים שמחכות לחזרה היום.</span>`}
  </section>
  ${rev}
  <section class="panel">
    <h2>כמה אתה מוכן לטיול</h2>
    <div class="ready">${learnIds().map(id => { const p = readiness(id); return `<button data-go="${id}"><span>${esc(SCN[id].title)} <span class="muted small">· ${doneList(id).length}/${SCN[id].convs.length} שיחות</span></span><b>${p}%</b><span class="bar"><i style="width:${p}%"></i></span></button>`; }).join("")}</div>
    <p class="note" style="margin:0">המוכנות מחושבת מהמילים שאתה שולט בהן ומהשיחות שהשלמת. לחיצה על נושא פותחת את השיחה הבאה שלו.</p>
  </section>`;
}
function bindToday(v) {
  v.querySelector("#flight").onchange = e => { S.flight = e.target.value || null; save(); render(); };
  const dg = v.querySelector("#dueGo"); if (dg) dg.onclick = () => { cardsState = { deck: due().map(e => ({ w: e, scn: e.scn })), idx: 0, flip: false, title: "חזרה יומית", tip: pick(ETIQ), fixed: true }; go("cards"); };
  v.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    cur = b.dataset.go; const sc = SCN[cur], dn = doneList(cur);
    const next = sc.convs.findIndex((_, i) => !dn.includes(i)); if (next >= 0) S.pos[cur] = next;
    resetConv(); cardsState = null; go("talk");
  });
  v.querySelectorAll("[data-say]").forEach(b => b.onclick = () => play([JSON.parse(b.dataset.say)], { speed: S.settings.speed }));
  const L = prevLesson();
  const st = v.querySelector("#rvStart");
  if (st) st.onclick = () => {
    const items = L.items.map(k => S.words[k]).filter(Boolean).slice(0, 5);
    const pool = [...new Set(Object.values(SCN).flatMap(s => s.words.map(w => w.he)))];
    review = { k: 0, score: 0, picked: null, tip: pick(SCN[L.scn]?.tips?.length ? SCN[L.scn].tips : ETIQ), qs: items.map(w => { const wrong = pool.filter(x => x !== w.he).sort(() => Math.random() - .5).slice(0, 3); return { w, choices: [w.he, ...wrong].sort(() => Math.random() - .5) }; }) };
    render();
  };
  const sk = v.querySelector("#rvSkip"); if (sk) sk.onclick = () => { review = { done: true, score: 0, qs: [], skipped: true }; cur = SCN[L.scn] ? L.scn : "airport"; resetConv(); go("talk"); };
  v.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const q = review.qs[review.k]; review.picked = +b.dataset.a;
    const ok = q.choices[review.picked] === q.w.he; if (ok) review.score++;
    rate(q.w, q.w.scn || L.scn, ok); render();
  });
  const nx = v.querySelector("#rvNext"); if (nx) nx.onclick = () => { review.picked = null; review.k++; if (review.k >= review.qs.length) review.done = true; render(); };
}

function freePrompt(chat) {

async function freeSend(text) {

    const d = await sample.json(freePrompt(chat), { modelTier: "default", effort: "low", cache: false, signal: fz.ctl.signal });

  { he: "אני לא מדבר יפנית. אתה מדבר אנגלית?", ja: "日本語が話せません。\n英語は話せますか？", kana: "にほんごがはなせません。えいごわはなせますか？" },
  { he: "תזמינו אמבולנס, בבקשה!", ja: "救急車を呼んでください！", kana: "きゅうきゅうしゃをよんでください！" },
  { he: "תזמינו משטרה, בבקשה!", ja: "警察を呼んでください！", kana: "けいさつをよんでください！" },
  { he: "הלכתי לאיבוד. עזרו לי, בבקשה.", ja: "道に迷いました。\n助けてください。", kana: "みちにまよいました。たすけてください。" },
  { he: "איפה השירותים?", ja: "トイレはどこですか？", kana: "トイレわどこですか？" },
  { he: "כמה זה עולה? כתבו לי כאן, בבקשה.", ja: "いくらですか？\nここに書いてください。", kana: "いくらですか？ここにかいてください。" },
  { he: "אפשר לשלם בכרטיס אשראי?", ja: "カードで払えますか？", kana: "カードではらえますか？" }
];
function hotelCard() {
  const t = S.trip;
  return { he: `קחו אותי למלון הזה, בבקשה.${t.hotel || t.addr ? "" : " (כתבו את שם המלון והכתובת למטה)"}`, ja: `このホテルまでお願いします。${t.hotel ? "\n" + t.hotel : ""}${t.addr ? "\n" + t.addr : ""}`, kana: "このホテルまでおねがいします。", small: true };
}
function allergyCard() {
  const t = S.trip, sel = ALG.filter(a => t.alg.includes(a.id));
  let ja = "", kana = "", he = [];
  if (sel.length) {
    const j = sel.map(a => a.ja).join("、"), k = sel.map(a => a.kana).join("、");
    ja += `私は${j}のアレルギーがあります。\n${j}が入っていない料理をお願いします。`;
    kana += `わたしわ${k}のアレルギーがあります。${k}がはいっていないりょうりをおねがいします。`;
    he.push(`יש לי אלרגיה ל${sel.map(a => a.he).join(", ")}. אבקש מנה בלי ${sel.map(a => a.he).join(", ")}.`);
  }
  if (t.pork) { ja += (ja ? "\n" : "") + "豚肉は食べられません。"; kana += "ぶたにくわたべられません。"; he.push("אני לא אוכל בשר חזיר."); }
  if (t.veg) { ja += (ja ? "\n" : "") + "私はベジタリアンです。\n肉と魚は食べられません。"; kana += "わたしわベジタリアンです。にくとさかなわたべられません。"; he.push("אני צמחוני. אני לא אוכל בשר ודגים."); }
  return { ja, kana, he: he.join(" ") };
}
function phrases() {
  const out = [], seen = new Set();
  for (const id of learnIds()) SCN[id].convs.forEach((c, ci) => c.dialog.forEach(s => {
    if (s.who !== "user") return;
    for (const o of s.opts) if (o.ok) { const k = jaStr(o.toks); if (!seen.has(k)) { seen.add(k); out.push({ toks: o.toks, tr: o.tr, scn: id, conv: ci }); } }
  }));
  return out;
}
function showCard(card) {
  const root = $("#sheetRoot");
  root.innerHTML = `<div class="showov" dir="rtl" role="dialog" aria-modal="true" aria-label="כרטיס להראות">
    <div class="row" style="justify-content:space-between"><span class="tag">הראה למקומי</span><button class="icon-btn" data-close>סגירה</button></div>
    <div class="bigja${card.small ? " sm" : ""}" lang="ja">${card.ja.split("\n").map(l => `<div>${esc(l)}</div>`).join("")}</div>
    <div class="he">${esc(card.he)}</div>
    <div class="row"><button class="btn primary" id="shSay">השמעה ביפנית</button><button class="btn soft" id="shSlow">השמעה איטית</button></div>
  </div>`;
  const t = [{ ja: card.ja.replace(/\n/g, ""), kana: card.kana || "", ro: "", he: "" }];
  root.querySelector("[data-close]").onclick = () => { stopSpeech(); root.innerHTML = ""; };
  root.querySelector("#shSay").onclick = () => play(t, { speed: 2 });
  root.querySelector("#shSlow").onclick = () => play(t, { speed: 1 });
}
function tripHTML() {
  const t = S.trip, on = online(), list = phrases().filter(p => !pb.scn || p.scn === pb.scn);
  const hay = p => [jaStr(p.toks), p.toks.map(x => x.kana).join(""), p.toks.map(x => x.ro).join(" "), p.tr, heTr(p.toks.map(x => x.ro).join(" "))].join(" ").toLowerCase();
  return `<section class="panel">
    <div class="row" style="justify-content:space-between"><h2>מצב טיול</h2><span class="tag ${on ? "good" : "warn"}">${on ? "מחובר לאינטרנט" : "בלי אינטרנט"}</span></div>
    <p class="muted small" style="margin:0">כל השיחות, ספר הביטויים והכרטיסים שמורים בתוך הדף, ועובדים גם בלי אינטרנט אחרי שהדף נטען. השארו עם הדף פתוח לפני שאתם יוצאים לאזור בלי קליטה. רק שיחה חופשית ויצירת נושא משלך צריכות חיבור.</p>
  </section>
  <section class="panel">
    <h2>הראה למקומי</h2>
    <p class="note" style="margin:0">כרטיס בטקסט גדול להראות לנהג, למלצר או לשוטר, עם השמעה ביפנית.</p>
    <div class="field"><label for="tHotel">שם המלון</label><input id="tHotel" value="${esc(t.hotel)}" placeholder="למשל: Hotel Sakura Shinjuku" autocomplete="off"></div>
    <div class="field"><label for="tAddr">כתובת המלון (העתיקו מאתר ההזמנה, עדיף ביפנית)</label><input id="tAddr" value="${esc(t.addr)}" placeholder="למשל: 東京都新宿区西新宿1-2-3" autocomplete="off"></div>
    <button class="btn primary" data-show="hotel">הצג כרטיס מלון</button>
    <div class="field"><span>האלרגיות והמגבלות שלי</span>
      <div class="alg">${ALG.map(a => `<label><input type="checkbox" data-alg="${a.id}" ${t.alg.includes(a.id) ? "checked" : ""}>${esc(a.he)}</label>`).join("")}
      <label><input type="checkbox" id="tPork" ${t.pork ? "checked" : ""}>בלי חזיר</label><label><input type="checkbox" id="tVeg" ${t.veg ? "checked" : ""}>צמחוני</label></div></div>
    <button class="btn primary" data-show="alg" ${t.alg.length || t.pork || t.veg ? "" : "disabled"}>הצג כרטיס אלרגיה</button>
    <div class="small muted">משפטים מוכנים:</div>
    <div class="showgrid">${FIXED.map((f, i) => `<button data-show="${i}"><span>${esc(f.he)}</span><span class="j" lang="ja">${esc(f.ja.replace(/\n/g, ""))}</span></button>`).join("")}</div>
  </section>
  <section class="panel">
    <div class="row" style="justify-content:space-between"><h2>ספר ביטויים מהיר</h2><span class="counter" id="pbCount">${list.length}</span></div>
    <div class="filters">
      <input id="pbq" type="search" placeholder="חיפוש: דרכון, אלרגיה, いくら, kippu..." value="${esc(pb.q)}">
      <select id="pbs" aria-label="נושא" style="grid-column:1/-1"><option value="">כל הנושאים</option>${learnIds().map(id => `<option value="${id}" ${pb.scn === id ? "selected" : ""}>${esc(SCN[id].title)}</option>`).join("")}</select>
    </div>
    <div class="pb" id="pbList">${list.map((p, i) => `<div class="p" data-h="${esc(hay(p))}"><div class="j" lang="ja" id="pb${i}">${esc(jaStr(p.toks))}</div><div class="r">${esc(p.toks.map(x => x.ro).join(" "))}</div><div class="m">${esc(p.tr)}</div><div class="h">${esc(heTr(p.toks.map(x => x.ro).join(" ")))} · ${esc(SCN[p.scn].title)}</div><div class="act"><button class="play" data-pp="${i}" aria-label="השמעה">${PLAY_ICON}</button><button class="btn soft mini-btn" data-ps="${i}">הצג</button></div></div>`).join("")}</div>
    <p class="muted" id="pbNone" style="margin:0" hidden>לא נמצא ביטוי. נסו מילה אחרת.</p>
  </section>`;
}
function bindTrip(v) {
  const t = S.trip, list = phrases().filter(p => !pb.scn || p.scn === pb.scn);
  v.querySelector("#tHotel").oninput = e => { t.hotel = e.target.value; save(); };
  v.querySelector("#tAddr").oninput = e => { t.addr = e.target.value; save(); };
  v.querySelectorAll("[data-alg]").forEach(b => b.onchange = () => { const id = b.dataset.alg; t.alg = b.checked ? [...new Set([...t.alg, id])] : t.alg.filter(x => x !== id); save(); render(); });
  v.querySelector("#tPork").onchange = e => { t.pork = e.target.checked; save(); render(); };
  v.querySelector("#tVeg").onchange = e => { t.veg = e.target.checked; save(); render(); };
  v.querySelectorAll("[data-show]").forEach(b => b.onclick = () => { const k = b.dataset.show; showCard(k === "hotel" ? hotelCard() : k === "alg" ? allergyCard() : FIXED[+k]); });
  const filter = () => {
    const q = pb.q.trim().toLowerCase(); let n = 0;
    v.querySelectorAll("#pbList .p").forEach(el => { const ok = !q || el.dataset.h.includes(q); el.hidden = !ok; if (ok) n++; });
    v.querySelector("#pbCount").textContent = n; v.querySelector("#pbNone").hidden = n > 0;
  };
  v.querySelector("#pbq").oninput = e => { pb.q = e.target.value; filter(); };
  v.querySelector("#pbs").onchange = e => { pb.scn = e.target.value; render(); };
  v.querySelectorAll("[data-pp]").forEach(b => b.onclick = () => play(list[+b.dataset.pp].toks, { el: $("#pb" + b.dataset.pp) }));
  v.querySelectorAll("[data-ps]").forEach(b => b.onclick = () => { const p = list[+b.dataset.ps]; showCard({ ja: jaStr(p.toks), kana: p.toks.map(spoken).join(""), he: p.tr }); });
  filter();
}

/* ---------- sheets ---------- */
function sheet(html, onBind) {
  const root = $("#sheetRoot");
  root.innerHTML = `<div class="scrim" dir="rtl"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const close = () => { root.innerHTML = ""; };
  root.querySelector(".scrim").onclick = e => { if (e.target.classList.contains("scrim")) close(); };
  root.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
  onBind && onBind(root, close);
}
function openWord(w, scnId) {
  const clean = { ...w, ja: w.ja.replace(/[。、？！…]/g, ""), ro: w.ro.replace(/[.,?!…]/g, "") };
  const have = !!S.words[clean.ja];
  sheet(`<div class="head"><h2>פירוש המילה</h2><button class="icon-btn" data-close>סגירה</button></div>
    <div class="wordsheet" style="display:flex;flex-direction:column;gap:12px">
      <div class="big" lang="ja">${jaHTML(w, true)}</div>
      <dl><dt>פירוש</dt><dd>${esc(w.he || "—")}</dd><dt>רומאג'י</dt><dd style="direction:ltr;text-align:right">${esc(w.ro)}</dd><dt>תעתיק עברי</dt><dd>${esc(heTr(w.ro))}</dd>${w.kana ? `<dt>קריאה</dt><dd lang="ja">${esc(w.kana)}</dd>` : ""}</dl>
      <div class="row"><button class="btn soft" id="wSay">השמעה</button><button class="btn soft" id="wSlow">השמעה איטית</button><button class="btn primary" id="wAdd" ${have ? "disabled" : ""}>${have ? "כבר ברשימה שלך" : "הוסף ל\"המילים שלי\""}</button></div>
    </div>`, (root, close) => {
    root.querySelector("#wSay").onclick = () => play([w], { speed: 2 });
    root.querySelector("#wSlow").onclick = () => play([w], { speed: 0 });
    root.querySelector("#wAdd").onclick = () => { addWord(clean, scnId); touch(scnId, clean); close(); };
  });
}
$("#openSettings").onclick = () => {
  const st = S.settings;
  const sw = (k, l) => `<label class="sw"><span>${l}</span><input type="checkbox" id="set-${k}" ${st[k] ? "checked" : ""}></label>`;
  sheet(`<div class="head"><h2>הגדרות לימוד</h2><button class="icon-btn" data-close>סגירה</button></div>
    <div><h2 style="font-size:1rem">כתוביות</h2>
    ${sw("ja", "כתב יפני")}${sw("furi", "קריאה מעל הקאנג'י (פוריגאנה)")}${sw("ro", "תעתיק לטיני (רומאג'י)")}${sw("hetr", "תעתיק בעברית")}${sw("tr", "תרגום לעברית תמיד")}</div>
    <div class="field"><h2 style="font-size:1rem">מהירות דיבור</h2><div class="seg" role="group">${["איטי", "בינוני", "רגיל"].map((l, i) => `<button data-sp="${i}" aria-pressed="${st.speed === i}">${l}</button>`).join("")}</div><span class="note">איטי משמיע מילה אחרי מילה. רגיל הוא קצב דיבור טבעי.</span></div>
    <div class="field"><h2 style="font-size:1rem">דמות לשיחה</h2>${sw("avatar", "הצג את הדמות")}<div class="chars">${Object.entries(CHARS).map(([id, c]) => `<button data-ch="${id}" aria-pressed="${st.ch === id}">${avatarSVG(id)}<span>${esc(c.name)}</span><span class="muted">${esc(c.desc)}</span></button>`).join("")}</div></div>`,
    root => {
      ["ja", "furi", "ro", "hetr", "tr", "avatar"].forEach(k => root.querySelector("#set-" + k).onchange = e => { st[k] = e.target.checked; save(); render(); });
      root.querySelectorAll("[data-sp]").forEach(b => b.onclick = () => { st.speed = +b.dataset.sp; save(); root.querySelectorAll("[data-sp]").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); });
      root.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => { st.ch = b.dataset.ch; save(); root.querySelectorAll("[data-ch]").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); });
    });
};

/* ---------- new topic with AI ---------- */
function openNewTopic() {
  sheet(`<div class="head"><h2>נושא שיחה משלך</h2><button class="icon-btn" data-close>סגירה</button></div>
    <p class="muted" style="margin:0">כתבו מצב מהטיול, ו-Claude יכין לו מילים ושיחה ביפנית בסגנון של שאר הנושאים.</p>
    <form class="field" id="ntForm"><label for="ntIn">נושא</label><input id="ntIn" placeholder="למשל: מספרה, קניית כרטיס לקונצרט, חוף ים" autocomplete="off" required>
    <div class="row"><button class="btn primary" type="submit" id="ntGo">צור נושא</button><button class="btn" type="button" id="ntStop" hidden>עצור</button></div></form>
    <div id="ntOut" class="note"></div>`, (root, close) => {
    let ctl = null;
    root.querySelector("#ntStop").onclick = () => ctl && ctl.abort();
    root.querySelector("#ntForm").onsubmit = async e => {
      e.preventDefault();
      const topic = root.querySelector("#ntIn").value.trim(); if (!topic) return;
      const out = root.querySelector("#ntOut"), goB = root.querySelector("#ntGo"), stopB = root.querySelector("#ntStop");
      const sample = await getSample();
      if (!sample) { out.textContent = "יצירת נושא דורשת חיבור ל-Claude, והוא לא זמין בתצוגה הזו."; return; }
      ctl = new AbortController(); goB.disabled = true; stopB.hidden = false; out.textContent = "מכין מילים ושיחה... זה יכול לקחת עד דקה.";
      try {
        const data = await sample.json(topicPrompt(topic), { signal: ctl.signal });
        const sc = normalizeTopic(data);
        S.custom.push(sc); save(); loadScenarios(); cur = sc.id; resetConv(); cardsState = null; close(); go("talk");
      } catch (err) {
        out.textContent = err?.code === "cancelled" ? "הפעולה נעצרה." : (err?.message === "shape" ? "התוכן שהתקבל לא היה שלם. נסו שוב או נסחו את הנושא אחרת." : errText(err));
      } finally { goB.disabled = false; stopB.hidden = true; }
    };
  });
}
function topicPrompt(topic) {
  return `Create a short beginner Japanese lesson for Hebrew-speaking travelers in Japan. Topic (written by the learner, in Hebrew or English): """${topic.slice(0, 200)}"""
Use polite です/ます Japanese that a traveler really needs. Reply with only one JSON object:
{"title": "short Hebrew title", "role": "Hebrew name of the Japanese speaker's role, e.g. 'מוכר בחנות'", "tip": "one Hebrew sentence with a real cultural or etiquette tip for this situation",
 "words": [6 items {"ja": "word as written", "kana": "hiragana reading; REQUIRED whenever ja contains kanji, else empty", "ro": "Hepburn romaji with macrons", "he": "Hebrew meaning"}],
 "dialog": [steps alternating, starting with npc and ending with npc: 3 npc steps and 2 user steps]}
npc step: {"who":"npc","tokens":[TOKEN...],"tr":"Hebrew translation"}
user step: {"who":"user","options":[{"tokens":[TOKEN...],"tr":"Hebrew translation","ok":true}, {"tokens":[...],"tr":"...","ok":false,"why":"one short Hebrew sentence: why it is wrong and what to say, Japanese followed by Hebrew transliteration in parentheses"}, one more wrong option]}
${TOKEN_RULES} Exactly one ok option per user step; shuffle its position.`;
}
function normalizeTopic(d) {
  const words = (Array.isArray(d?.words) ? d.words : []).map(normTok).filter(t => t.ja && t.ro && t.he).slice(0, 10);
  const dialog = (Array.isArray(d?.dialog) ? d.dialog : []).map(s => s?.who === "user"
    ? { who: "user", opts: (Array.isArray(s.options) ? s.options : []).map(o => ({ toks: normToks(o.tokens), tr: String(o.tr || ""), ok: o.ok === true, why: String(o.why || "") })).filter(o => o.toks.length) }
    : { who: "npc", toks: normToks(s?.tokens), tr: String(s?.tr || "") });
  const valid = words.length >= 3 && dialog.length >= 3 && dialog[0].who === "npc" &&
    dialog.every((s, i) => (i % 2 === 0 ? s.who === "npc" && s.toks.length : s.who === "user" && s.opts.length >= 2 && s.opts.filter(o => o.ok).length === 1));
  if (!valid) throw new Error("shape");
  const title = String(d.title || "נושא חדש").slice(0, 30), role = String(d.role || "בן שיח").slice(0, 40);
  return { id: "c" + Date.now(), custom: true, title, role, convs: [{ title, role, tip: String(d.tip || ""), words, dialog }] };
}

render();
</script>
